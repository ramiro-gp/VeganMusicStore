name: Sincronizar catálogo
on:
  schedule:
    - cron: '0 1,12,14,17,20 * * *' # Argentina: 22:00, 09:00, 11:00, 14:00, 17:00 (UTC-3)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    if: vars.CATALOG_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_VARIANT: v1
      SITE_MODE: demo
      SITE_URL: https://vegan-store-music.vercel.app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.12.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Descargar, validar y construir antes de promover
        id: catalog
        run: pnpm catalog:sync --verify
        env:
          CATALOG_CSV_URL: ${{ vars.CATALOG_CSV_URL }}
      - name: Versionar el snapshot validado
        if: steps.catalog.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/catalog.snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar catálogo validado'
            git push
          fi
      - name: Archivos estáticos para Hostinger
        if: steps.catalog.outputs.changed == 'true' && vars.DEPLOY_TARGET == 'hostinger'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="$RUNNER_TEMP/vegan-static"
          mkdir -p "$target"
          cp -R dist/. "$target/"
          git -C "$target" init -b deploy-static
          git -C "$target" config user.name 'github-actions[bot]'
          git -C "$target" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$target" add .
          git -C "$target" commit -m 'Publicar build estático validado'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
          git -C "$target" -c "http.extraheader=AUTHORIZATION: basic $auth" push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:deploy-static
